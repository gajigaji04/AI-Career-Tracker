services:
  frontend:
    image: ${DOCKER_USERNAME}/ai-careerhub-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app

volumes:
  certbot-www:
  certbot-certs:
