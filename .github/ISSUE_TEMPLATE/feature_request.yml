name: ✨ 기능 제안
description: 새 기능이나 기존 기능 개선
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - Frontend
        - Backend (API)
        - DB / Prisma
        - AI (Groq)
        - 인증 / 보안
        - Infra (Docker / Nginx / CI·CD)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 배경 / 해결하려는 문제
      description: 왜 필요한가? 지금은 어떤 점이 불편한가?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작, 화면, API 형태 등
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      value: |
        - [ ] Prisma 스키마 / 마이그레이션
        - [ ] validation (create / update 스키마)
        - [ ] service + 단위 테스트
        - [ ] controller / route (+ Swagger 주석)
        - [ ] frontend api / hook / page
        - [ ] 문서 (README / docs) 반영

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안

  - type: textarea
    id: notes
    attributes:
      label: 참고 자료
