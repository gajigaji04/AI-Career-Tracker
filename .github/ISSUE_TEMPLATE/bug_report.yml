name: 🐛 버그 리포트
description: 동작이 잘못되거나 에러가 발생할 때
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - Frontend
        - Backend (API)
        - DB / Prisma
        - AI (Groq)
        - 인증 / 보안
        - Infra (Docker / Nginx / CI·CD)
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 발생 환경
      options:
        - 운영 (aicareerhub-site.duckdns.org)
        - 로컬 개발
        - Docker 로컬 실행
        - GitHub Actions
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 무엇이 잘못됐는지 한두 문장으로
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. /app/applications 접속
        2. AI 분석이 있는 지원 내역 삭제 클릭
        3. 500 에러 토스트
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 에러 메시지 / 스크린샷
      description: 토큰·비밀번호·인증번호·개인정보는 지우고 붙여주세요
      render: shell

  - type: textarea
    id: cause
    attributes:
      label: 원인 추정 / 관련 파일
      placeholder: "예: backend/src/services/application.service.ts — AiAnalysis FK ON DELETE RESTRICT"
