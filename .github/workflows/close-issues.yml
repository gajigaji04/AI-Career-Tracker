name: Close linked issues

# GitHub 는 기본 브랜치(main) 머지 때만 "Closes #N" 을 처리한다.
# dev 로 머지된 PR 도 본문의 Closes/Fixes/Resolves #N 이슈를 바로 닫는다.

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // HTML 주석(템플릿 안내문) 안의 키워드는 무시
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const numbers = [...new Set([...body.matchAll(re)].map((m) => Number(m[1])))];

            if (numbers.length === 0) {
              core.info('연결된 이슈 없음');
              return;
            }

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request) {
                  core.info(`#${issue_number} 는 PR 이라 건너뜀`);
                  continue;
                }
                if (issue.state === 'closed') {
                  core.info(`#${issue_number} 이미 닫힘`);
                  continue;
                }
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `#${pr.number} 가 \`dev\` 에 머지되어 닫습니다.`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`#${issue_number} 닫음`);
              } catch (e) {
                core.warning(`#${issue_number} 처리 실패: ${e.message}`);
              }
            }
